version: '3.8'

# Production-Setup auf dem VPS.
# - Eigener Postgres-Container (eigene DB 'messenger', getrennt von prompt-factory)
# - Backend als Container auf 127.0.0.1:3001, von Nginx angesprochen

services:
  db:
    image: postgres:16-alpine
    container_name: messenger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
    volumes:
      - messenger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: messenger-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Prisma 5.22 + Alpine 3.20+: auto-detection der libssl-Version ist
      # kaputt, fällt auf "openssl-1.1.x" zurück. Mit explizitem Pfad
      # lädt es die korrekte linux-musl-openssl-3.0.x binary.
      PRISMA_QUERY_ENGINE_LIBRARY: /app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  messenger_pgdata:
